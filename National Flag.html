<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATIONAL FLAG</title>
    <STYLE>

        body{
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 40px;

        }

        .FLAG1{
            height: 300px;
            width: 500px;
            background-color:chocolate;
            border: 1px solid black;
         
        }
        .FLAG2{
            height: 100px;
            background-color: rgb(239, 125, 44);
            
        }
        .FLAG3{
            height: 100px;
            background-color: rgb(253, 255, 255);
            font-family: ALGERIAN;
            font-size: 30px;
            text-align: center;
            align-content: center;
        }
        .FLAG4{
            height: 100px;
            background-color: green;
        }
    </STYLE>
</head>
<body>
----NATIONAL FLAG-----
    <div class="FLAG1">
        <div class="FLAG2"></div>
        <div class="FLAG3">HAPPY INDEPENDENCE DAY</div>
        <div class="FLAG4"></div>
    </div>

</body>
</html>
